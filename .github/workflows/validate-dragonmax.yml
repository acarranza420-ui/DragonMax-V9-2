name: Validate DragonMax Launch Candidate

on:
  push:
    branches: [main, dragonmax-stability-rc]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the exact release payload and installer
        run: python3 build_v12.py

      - name: Validate generated public distribution
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys, xml.etree.ElementTree as ET, zipfile

          root = pathlib.Path('public')
          errors=[]
          required_payload_addons = {
              'skin.auramod',
              'service.dragonmax.voice',
              'script.skin.helper.service',
              'script.skin.helper.widgets',
              'script.skinshortcuts',
              'plugin.video.themoviedb.helper',
              'script.module.metadatautils',
              'script.module.thetvdb',
              'script.module.musicbrainz',
              'script.module.jurialmunkey',
              'script.module.infotagger',
              'script.module.requests',
              'script.image.resource.select',
              'resource.images.moviegenreicons.transparent',
              'resource.images.studios.coloured',
              'resource.images.studios.white',
              'repository.auramod.aio',
              'repository.jurialmunkey',
              'repository.marcelveldt',
              'script.colorbox',
          }
          forbidden_parts={'.git','.github','.idea','.vscode','__pycache__','tests','test','docs','doc'}
          forbidden_suffixes={'.pyc','.pyo','.log','.tmp','.old'}

          try:
              tree=ET.parse(root/'addons.xml')
              versions={a.attrib.get('id'):a.attrib.get('version') for a in tree.getroot().findall('addon')}
          except Exception as exc:
              errors.append(f'generated addons.xml invalid: {exc}')
              versions={}

          try:
              actual=hashlib.md5((root/'addons.xml').read_bytes()).hexdigest()
              expected=(root/'addons.xml.md5').read_text().strip()
              if actual != expected:
                  errors.append(f'generated addons.xml.md5 mismatch: {expected} != {actual}')
          except Exception as exc:
              errors.append(f'generated repository checksum failed: {exc}')

          try:
              build_doc=json.loads((root/'build.json').read_text())
              build=build_doc['builds'][0]
          except Exception as exc:
              errors.append(f'generated build.json invalid: {exc}')
              build={}

          version=str(build.get('version',''))
          if version != '4.5.0':
              errors.append(f'unexpected release version: {version!r}')
          if versions.get('repository.dragonmax') != version:
              errors.append(f'repository version {versions.get("repository.dragonmax")} != build {version}')
          if versions.get('plugin.program.dragonmaxwizard') != version:
              errors.append(f'wizard version {versions.get("plugin.program.dragonmaxwizard")} != build {version}')
          if int(build.get('install_protocol',0)) < 4:
              errors.append('generated build does not use install protocol 4+')

          for doc in ('updates.json','themes.json','realms.json'):
              try: json.loads((root/doc).read_text())
              except Exception as exc: errors.append(f'{doc} invalid: {exc}')

          payload=root/build.get('zip','')
          if not payload.is_file():
              errors.append(f'payload missing: {payload}')
          else:
              minimum=int(build.get('minimum_size_mb',60))*1024*1024
              if payload.stat().st_size < minimum:
                  errors.append(f'payload undersized: {payload.stat().st_size}')
              sha=hashlib.sha256(payload.read_bytes()).hexdigest()
              if sha != build.get('sha256'):
                  errors.append('payload SHA-256 mismatch with generated build.json')
              try:
                  with zipfile.ZipFile(payload) as z:
                      bad=z.testzip()
                      if bad: errors.append(f'corrupt payload member: {bad}')
                      names=z.namelist()
                      normalized=['/'+n.replace('\\','/').strip('/') for n in names]

                      for n in normalized:
                          parts=[p for p in n.split('/') if p]
                          if any(p.lower() in forbidden_parts for p in parts):
                              errors.append(f'development debris present: {n}')
                          if pathlib.PurePosixPath(n).suffix.lower() in forbidden_suffixes:
                              errors.append(f'development file present: {n}')
                          if '/userdata/Database/' in n or '/userdata/Thumbnails/' in n or '/addons/packages/' in n:
                              errors.append(f'protected runtime content present: {n}')

                      for aid in sorted(required_payload_addons):
                          token=f'/addons/{aid}/addon.xml'
                          if not any(token in n for n in normalized):
                              errors.append(f'required launch dependency missing from payload: {aid}')

                      if not any('/dragonmax/install_manifest.json' in n for n in normalized):
                          errors.append('install manifest missing from payload')
              except Exception as exc:
                  errors.append(f'payload ZIP validation failed: {exc}')

          for addon_id in ('repository.dragonmax','plugin.program.dragonmaxwizard'):
              zpath=root/f'{addon_id}-{version}.zip'
              if not zpath.is_file():
                  errors.append(f'installer artifact missing: {zpath}')
              else:
                  try:
                      with zipfile.ZipFile(zpath) as z:
                          bad=z.testzip()
                          if bad: errors.append(f'{zpath.name} corrupt member: {bad}')
                  except Exception as exc:
                      errors.append(f'{zpath.name} invalid: {exc}')

          if build.get('ready'):
              errors.append('CI must not publish ready=true before a real Fire TV validation pass')

          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              sys.exit(1)
          print('DragonMax launch-candidate distribution passed expanded Omega dependency validation.')
          PY

      - name: Simulate launch experience and Fire TV budgets
        run: python3 validate_launch_experience.py

      - name: Validate resilience, upgrade preservation, and recovery
        run: python3 validate_resilience.py
